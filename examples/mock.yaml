$schema: https://raw.githubusercontent.com/mishalajmi/mimic/main/schema/mimic-v1.json
routes:
  - name: Hello Mock
    request:
      method: GET
      path: /hello
    response:
      status: 200
      headers:
        Content-Type: text/plain
        X-Mimic: true
      body: "Hello, from mimic"

  - name: User 123 Mock
    request:
      method: GET
      path: /users/123
    response:
      status: 200
      headers:
        Content-Type: application/json
      body:
        id: 123
        name: mimic
